name: Deploy

on:
  push:
    branches: [main]

concurrency: deploy-${{ github.ref }}

# Pas de branche `dev` : eclipse et equinoxe suivent tous deux `main`.
jobs:
  deploy_eclipse:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECLIPSE_PREPRODUCTION_DEPLOY_KEY }}" > ~/.ssh/deployment.key
          chmod 600 ~/.ssh/deployment.key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deployment.key debian@eclipse.mes-aides.incubateur.net

  deploy_equinoxe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EQUINOXE_PRODUCTION_DEPLOY_KEY }}" > ~/.ssh/deployment.key
          chmod 600 ~/.ssh/deployment.key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deployment.key debian@equinoxe.mes-aides.1jeune1solution.beta.gouv.fr
